name: Android Release

on:
  # Tags are created by release.yml from pubspec.yaml; this workflow can also be
  # run on its own for a re-build of an existing tag.
  push:
    tags:
      - "android-v*"
  workflow_call:
    inputs:
      tag:
        description: Android release tag to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Android release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release request
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$REQUESTED_TAG" =~ ^android-v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?\+([0-9]+)$ ]]; then
            echo "::error::Invalid Android release tag: $REQUESTED_TAG"
            echo "Expected format: android-vX.Y.Z+B or android-vX.Y.Z-<pre-release>+B"
            exit 1
          fi
          build_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          prerelease="${BASH_REMATCH[4]}"
          build_number="${BASH_REMATCH[5]}"

          # pubspec.yaml is the single source of the app version; the tag only
          # names an already-versioned commit. Refuse to publish a build whose
          # store version and source version disagree.
          # The platform version stamp is X.Y.Z, so a pre-release suffix in
          # pubspec (declared, or the -rc.N release.yml derives) is not part of
          # what this tag must match.
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          pubspec_name="${pubspec_version%%+*}"
          pubspec_base="${pubspec_name%%-*}"
          pubspec_code="${pubspec_version##*+}"
          if [[ "$pubspec_version" == "$pubspec_code" ]]; then
            echo "::error::pubspec.yaml version $pubspec_version has no '+N' build number; a release needs one and pubspec.yaml is its only source."
            exit 1
          fi
          if [[ "$pubspec_base" != "$build_name" || "$pubspec_code" != "$build_number" ]]; then
            echo "::error::Tag $REQUESTED_TAG names $build_name+$build_number, but pubspec.yaml is $pubspec_version."
            exit 1
          fi

          tag_sha="$(git rev-list -n 1 "$REQUESTED_TAG")"
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$tag_sha" origin/master; then
            echo "::error::Release tag must point to a commit reachable from master."
            exit 1
          fi

          {
            echo "TAG_NAME=$REQUESTED_TAG"
            echo "BUILD_NAME=$build_name"
            echo "BUILD_NUMBER=$build_number"
            echo "PRERELEASE=$([[ -n "$prerelease" ]] && echo true || echo false)"
          } >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.4
          cache: true

      - name: Resolve locked dependencies
        # The committed lock resolves through the China mirror (see .envrc).
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get --enforce-lockfile

      - name: Restore signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::error::Missing android-release environment secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi

          umask 077
          keystore_path="$RUNNER_TEMP/techpie-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed ARM64 and ARM32 APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing android-release environment secret: $secret_name"
              exit 1
            fi
          done

          flutter build apk \
            --release \
            --no-pub \
            --split-per-abi \
            --target-platform android-arm64,android-arm \
            --build-name "$BUILD_NAME" \
            --build-number "$BUILD_NUMBER"

      - name: Verify signatures and collect APKs
        shell: bash
        env:
          EXPECTED_APPLICATION_ID: club.geekpie.techpie
          EXPECTED_CERT_SHA256: 1c8155ee7940f2bef76816f24fce3044a7a083ed2032bb9dcef3de7be4284a98
        run: |
          set -euo pipefail

          mkdir -p dist
          aapt="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$aapt"
          test -x "$apksigner"

          for architecture in arm64 arm32; do
            abi=arm64-v8a
            [[ "$architecture" == arm32 ]] && abi=armeabi-v7a
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            badging="$("$aapt" dump badging "$apk")"
            apk_application_id="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
            if [[ "$apk_application_id" != "$EXPECTED_APPLICATION_ID" ]]; then
              echo "::error::APK application ID does not match the production application ID."
              exit 1
            fi
            if [[ "$(sed -n 's/^native-code: //p' <<< "$badging")" != "'$abi'" ]]; then
              echo "::error::APK must contain only $abi native libraries."
              exit 1
            fi
            "$apksigner" verify --verbose --print-certs "$apk"
            apk_cert="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | sed -n '1p' | tr '[:upper:]' '[:lower:]')"
            if [[ "$apk_cert" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "::error::APK signing certificate does not match the production certificate."
              exit 1
            fi
            cp "$apk" "dist/TechPie-${TAG_NAME}-${architecture}-only.apk"
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@v7
        with:
          name: TechPie-${{ env.TAG_NAME }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release with APK checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          notes="$RUNNER_TEMP/release-notes.txt"
          {
            git for-each-ref --format='%(contents:body)' "refs/tags/$TAG_NAME"
            printf '\n## SHA-256\n\n```text\n'
            (cd dist && sha256sum *.apk)
            printf '```\n'
          } > "$notes"

          gh release create "$TAG_NAME" dist/*.apk \
            --verify-tag \
            --title "$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG_NAME")" \
            --notes-file "$notes" \
            --prerelease="$PRERELEASE"
