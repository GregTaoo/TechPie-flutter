name: Dispatch iOS Release

on:
  # Tags are created by release.yml from pubspec.yaml; this workflow can also be
  # run on its own to re-dispatch an existing tag. The tag stays X.Y.Z+B even for
  # a pre-release, because the signing workflow validates exactly that shape.
  push:
    tags:
      - "ios-v*"
  workflow_call:
    inputs:
      tag:
        description: iOS release tag to dispatch
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: iOS release tag to dispatch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^ios-v([0-9]+)\.([0-9]+)\.([0-9]+)\+([0-9]+)$ ]]; then
            echo "Invalid iOS release tag: $TAG_NAME"
            echo "Expected format: ios-vX.Y.Z+B"
            exit 1
          fi

          BUILD_NAME="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          BUILD_NUMBER="${BASH_REMATCH[4]}"
          TAG_SHA="$(git rev-list -n 1 "$TAG_NAME")"

          # pubspec.yaml (as of this tag) is the version source; the tag only
          # carries the version it was cut from. A pre-release suffix in pubspec
          # does not reach iOS, whose CFBundleShortVersionString stays X.Y.Z.
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          pubspec_name="${pubspec_version%%+*}"
          pubspec_base="${pubspec_name%%-*}"
          pubspec_code="${pubspec_version##*+}"
          if [[ "$pubspec_base" != "$BUILD_NAME" || "$pubspec_code" != "$BUILD_NUMBER" ]]; then
            echo "::error::Tag $TAG_NAME names $BUILD_NAME+$BUILD_NUMBER, but pubspec.yaml is $pubspec_version."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main || true
          git fetch --no-tags origin master:refs/remotes/origin/master || true

          reachable=false
          for branch in origin/main origin/master; do
            if git rev-parse --verify --quiet "$branch" >/dev/null; then
              if git merge-base --is-ancestor "$TAG_SHA" "$branch"; then
                reachable=true
                break
              fi
            fi
          done

          if [[ "$reachable" != "true" ]]; then
            echo "Release tag must point to a commit reachable from main or master."
            exit 1
          fi

          {
            echo "TAG_NAME=$TAG_NAME"
            echo "BUILD_NAME=$BUILD_NAME"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "TAG_SHA=$TAG_SHA"
          } >> "$GITHUB_ENV"

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: CNDY1390
          repositories: TechPie-release
          permission-actions: write

      - name: Dispatch private signed release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          payload="$(
            jq -n \
              --arg ref "main" \
              --arg tag "$TAG_NAME" \
              '{
                ref: $ref,
                inputs: {
                  tag: $tag,
                  upload_to_testflight: "true"
                }
              }'
          )"

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/CNDY1390/TechPie-release/actions/workflows/ios-signed-release.yml/dispatches \
            -d "$payload"
