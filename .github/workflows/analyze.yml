name: Analyze

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: analyze-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          cache: true

      - name: Install dependencies
        # The committed lock resolves through the China mirror (see .envrc), so
        # the drift check below compares against the same host.
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
        run: flutter pub get

      - name: Verify dependency graph
        shell: bash
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test
